name: Quality gates

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drillloop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, scan, browser, and container verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_DB: drillloop_ci
          POSTGRES_USER: drillloop_ci
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drillloop_ci -d drillloop_ci"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 15
      clamav:
        image: clamav/clamav-debian:1.5.4@sha256:c21aa18cc0a358678255a3dfb343a4555b58f71b97d7b869df8fdf7ea0a5b4b1
        env:
          CLAMAV_NO_MILTERD: "true"
          CLAMAV_NO_FRESHCLAMD: "false"
          FRESHCLAM_CHECKS: "1"
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 6m
          --health-retries 18
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          npm --prefix frontend ci

      - name: Python lint
        run: ruff check backend scripts

      - name: Python formatting
        run: ruff format --check backend scripts

      - name: Wait for fresh ClamAV signatures loaded by clamd
        env:
          CLAMAV_CONTAINER_ID: ${{ job.services.clamav.id }}
        run: >-
          python scripts/wait_for_clamav.py
          --container-id "$CLAMAV_CONTAINER_ID"
          --host 127.0.0.1
          --port 3310
          --max-age-hours 72
          --timeout-seconds 600
          --interval-seconds 5
          --socket-timeout-seconds 3
          --expected-engine-version 1.5.4

      - name: Backend tests
        env:
          DRILLLOOP_TEST_CLAMAV_HOST: 127.0.0.1
          DRILLLOOP_TEST_CLAMAV_PORT: 3310
        run: pytest -q

      - name: Python dependency audit
        run: pip-audit -r requirements-dev.lock

      - name: Frontend dependency audit
        run: npm --prefix frontend audit --audit-level=high

      - name: TypeScript and production build
        run: npm --prefix frontend run build

      - name: Validate fresh SQLite migrations
        shell: bash
        run: |
          set -euo pipefail
          owned_dir="$(mktemp -d "${RUNNER_TEMP}/drillloop-migration.XXXXXX")"
          chmod 700 "$owned_dir"
          token="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          printf '%s' "$token" > "$owned_dir/.drillloop-test-owner"
          chmod 600 "$owned_dir/.drillloop-test-owner"
          cleanup() {
            OWNED_DIR="$owned_dir" OWNER_TOKEN="$token" python -c 'import os,shutil; from pathlib import Path; p=Path(os.environ["OWNED_DIR"]); m=p/".drillloop-test-owner"; shutil.rmtree(p) if m.is_file() and m.read_text().strip()==os.environ["OWNER_TOKEN"] else None'
          }
          trap cleanup EXIT
          export DRILLLOOP_TEST_MODE=1
          export DRILLLOOP_TEST_DB_ROOT="$owned_dir"
          export DRILLLOOP_TEST_DB_TOKEN="$token"
          export DATABASE_URL="sqlite:///$owned_dir/test-ci.sqlite3"
          alembic upgrade head
          alembic check
          test -f "$owned_dir/test-ci.sqlite3"

      - name: Validate PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://drillloop_ci:ci-only-disposable-password@127.0.0.1:5432/drillloop_ci
        run: |
          alembic upgrade head
          alembic current
          alembic check

      - name: Install Chromium
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Browser workflow on fresh owned SQLite
        shell: bash
        run: |
          set -euo pipefail
          owned_dir="$(mktemp -d "${RUNNER_TEMP}/drillloop-browser.XXXXXX")"
          chmod 700 "$owned_dir"
          token="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          printf '%s' "$token" > "$owned_dir/.drillloop-test-owner"
          chmod 600 "$owned_dir/.drillloop-test-owner"
          cleanup() {
            kill "${ui_pid:-}" "${api_pid:-}" 2>/dev/null || true
            if [[ -f "$owned_dir/.drillloop-test-owner" ]] && [[ "$(cat "$owned_dir/.drillloop-test-owner")" == "$token" ]]; then
              rm -rf -- "$owned_dir"
            fi
          }
          trap cleanup EXIT
          export DRILLLOOP_TEST_MODE=1
          export DRILLLOOP_TEST_DB_ROOT="$owned_dir"
          export DRILLLOOP_TEST_DB_TOKEN="$token"
          export DATABASE_URL="sqlite:///$owned_dir/test-browser.sqlite3"
          export DRILLLOOP_ENVIRONMENT=test
          export DRILLLOOP_COOKIE_SECURE=0
          DRILLLOOP_SESSION_SECRET="$(python -c 'import secrets; print(secrets.token_hex(48))')"
          export DRILLLOOP_SESSION_SECRET
          export DRILLLOOP_ENABLE_DEMO_SEED=1
          export DEMO_SEED=0
          export DRILLLOOP_UPLOAD_SCAN_MODE=disabled
          DRILLLOOP_USERS_JSON="$(PYTHONPATH=backend python -c 'import json; from app.auth import hash_password; print(json.dumps([{"id":"ci-admin","username":"ci-admin","name":"Demo Administrator","role":"admin","organization_id":"ci","password_hash":hash_password("ci-only-browser-password")},{"id":"ci-outsider","username":"ci-outsider","name":"CI Viewer","role":"viewer","organization_id":"ci","password_hash":hash_password("ci-only-outsider-password")}]))')"
          export DRILLLOOP_USERS_JSON
          alembic upgrade head
          PYTHONPATH=backend uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$owned_dir/api.log" 2>&1 &
          api_pid=$!
          npm --prefix frontend run dev -- --host 127.0.0.1 > "$owned_dir/ui.log" 2>&1 &
          ui_pid=$!
          for ((attempt=1; attempt<=60; attempt++)); do
            if curl --silent --fail http://127.0.0.1:8000/api/ready >/dev/null && curl --silent --fail http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/api/ready
          DRILLLOOP_E2E_USERNAME=ci-admin DRILLLOOP_E2E_PASSWORD=ci-only-browser-password DRILLLOOP_E2E_OUTSIDER_USERNAME=ci-outsider DRILLLOOP_E2E_OUTSIDER_PASSWORD=ci-only-outsider-password node frontend/e2e/live-workflow.mjs

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Build production container
        run: docker build --build-arg BUILD_VERSION=ci --build-arg "BUILD_REVISION=${GITHUB_SHA}" --tag drillloop:ci .

      - name: Verify hardened container against disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d "${RUNNER_TEMP}/drillloop-container.XXXXXX")"
          chmod 700 "$secret_dir"
          token="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          printf '%s' "$token" > "$secret_dir/.owner"
          printf '%s' 'ci-only-disposable-password' > "$secret_dir/db_password"
          PYTHONPATH=backend python -c 'import json; from app.auth import hash_password; print(json.dumps([{"id":"ci-admin","username":"ci-admin","name":"CI Admin","role":"admin","organization_id":"ci","password_hash":hash_password("ci-only-container-password")}]))' > "$secret_dir/users.json"
          python -c 'import secrets; print(secrets.token_hex(48))' > "$secret_dir/session_secret"
          chmod 600 "$secret_dir"/*
          cleanup() {
            docker rm -f drillloop-ci-container >/dev/null 2>&1 || true
            if [[ -f "$secret_dir/.owner" ]] && [[ "$(cat "$secret_dir/.owner")" == "$token" ]]; then
              rm -rf -- "$secret_dir"
            fi
          }
          trap cleanup EXIT
          docker run --detach --name drillloop-ci-container --network host --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 --cap-drop=ALL \
            --security-opt no-new-privileges:true --user 10001:10001 \
            --mount "type=bind,src=$secret_dir/db_password,dst=/run/secrets/database_password,readonly" \
            --mount "type=bind,src=$secret_dir/session_secret,dst=/run/secrets/session_secret,readonly" \
            --mount "type=bind,src=$secret_dir/users.json,dst=/run/secrets/users_json,readonly" \
            --env DRILLLOOP_ENVIRONMENT=production \
            --env DATABASE_URL=postgresql+psycopg://drillloop_ci@127.0.0.1:5432/drillloop_ci \
            --env DATABASE_PASSWORD_FILE=/run/secrets/database_password \
            --env DRILLLOOP_SESSION_SECRET_FILE=/run/secrets/session_secret \
            --env DRILLLOOP_USERS_FILE=/run/secrets/users_json \
            --env DRILLLOOP_COOKIE_SECURE=1 --env DRILLLOOP_UPLOAD_SCAN_MODE=required \
            --env DRILLLOOP_SCANNER_HOST=127.0.0.1 --env DRILLLOOP_SCANNER_PORT=3310 \
            --env DRILLLOOP_SCANNER_MAX_SIGNATURE_AGE_HOURS=72 \
            --env DRILLLOOP_TRUSTED_HOSTS=127.0.0.1,localhost --env DEMO_SEED=0 \
            drillloop:ci
          for ((attempt=1; attempt<=40; attempt++)); do
            if curl --silent --fail http://127.0.0.1:8000/api/ready > "$secret_dir/ready.json"; then break; fi
            sleep 1
          done
          grep -q '"status":"ready"' "$secret_dir/ready.json"
          grep -q '"revision":"' "$secret_dir/ready.json"

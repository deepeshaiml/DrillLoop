name: Quality gates

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drillloop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, scan, browser, and container verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_DB: drillloop_ci
          POSTGRES_USER: drillloop_ci
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drillloop_ci -d drillloop_ci"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 15
      clamav:
        image: clamav/clamav-debian:1.5.4@sha256:c21aa18cc0a358678255a3dfb343a4555b58f71b97d7b869df8fdf7ea0a5b4b1
        env:
          CLAMAV_NO_MILTERD: "true"
          CLAMAV_NO_FRESHCLAMD: "true"
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 6m
          --health-retries 18
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          npm --prefix frontend ci

      - name: Python lint
        run: ruff check backend scripts

      - name: Python formatting
        run: ruff format --check backend scripts

      - name: Wait for fresh ClamAV signatures loaded by clamd
        env:
          CLAMAV_CONTAINER_ID: ${{ job.services.clamav.id }}
        run: >-
          python scripts/wait_for_clamav.py
          --container-id "$CLAMAV_CONTAINER_ID"
          --host 127.0.0.1
          --port 3310
          --max-age-hours 72
          --timeout-seconds 600
          --freshclam-timeout-seconds 300
          --interval-seconds 5
          --socket-timeout-seconds 3
          --expected-engine-version 1.5.4

      - name: Backend tests
        env:
          DRILLLOOP_TEST_CLAMAV_HOST: 127.0.0.1
          DRILLLOOP_TEST_CLAMAV_PORT: 3310
        run: pytest -q

      - name: Python dependency audit
        run: pip-audit -r requirements-dev.lock

      - name: Frontend dependency audit
        run: npm --prefix frontend audit --audit-level=high

      - name: TypeScript and production build
        run: npm --prefix frontend run build

      - name: Validate fresh SQLite migrations
        shell: bash
        run: |
          set -euo pipefail
          owned_dir="$(mktemp -d "${RUNNER_TEMP}/drillloop-migration.XXXXXX")"
          chmod 700 "$owned_dir"
          token="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          printf '%s' "$token" > "$owned_dir/.drillloop-test-owner"
          chmod 600 "$owned_dir/.drillloop-test-owner"
          cleanup() {
            OWNED_DIR="$owned_dir" OWNER_TOKEN="$token" python -c 'import os,shutil; from pathlib import Path; p=Path(os.environ["OWNED_DIR"]); m=p/".drillloop-test-owner"; shutil.rmtree(p) if m.is_file() and m.read_text().strip()==os.environ["OWNER_TOKEN"] else None'
          }
          trap cleanup EXIT
          export DRILLLOOP_TEST_MODE=1
          export DRILLLOOP_TEST_DB_ROOT="$owned_dir"
          export DRILLLOOP_TEST_DB_TOKEN="$token"
          export DATABASE_URL="sqlite:///$owned_dir/test-ci.sqlite3"
          alembic upgrade head
          alembic check
          test -f "$owned_dir/test-ci.sqlite3"

      - name: Validate PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://drillloop_ci:ci-only-disposable-password@127.0.0.1:5432/drillloop_ci
        run: |
          alembic upgrade head
          alembic current
          alembic check

      - name: Install Chromium
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Browser workflow on fresh owned SQLite
        id: browser_workflow
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_dir="$(mktemp -d "${RUNNER_TEMP}/drillloop-browser-diagnostics.XXXXXX")"
          chmod 700 "$diagnostic_dir"
          printf 'diagnostics_dir=%s\n' "$diagnostic_dir" >> "$GITHUB_OUTPUT"
          owned_dir="$(mktemp -d "${RUNNER_TEMP}/drillloop-browser.XXXXXX")"
          chmod 700 "$owned_dir"
          token="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          printf '%s' "$token" > "$owned_dir/.drillloop-test-owner"
          chmod 600 "$owned_dir/.drillloop-test-owner"
          api_pid=""
          ui_pid=""
          record_process() {
            local label="$1" pid="$2" process_state exit_status
            if [[ -z "$pid" ]]; then
              printf '%s=not-started\n' "$label" >> "$diagnostic_dir/process-status.txt"
            elif kill -0 "$pid" 2>/dev/null; then
              process_state="$(ps -p "$pid" -o stat=,etime=,comm= 2>/dev/null | sed 's/^[[:space:]]*//' | tr -s ' ' || true)"
              if [[ "$process_state" == Z* ]]; then
                if wait "$pid"; then exit_status=0; else exit_status=$?; fi
                printf '%s=exited pid=%s status=%s state=zombie\n' "$label" "$pid" "$exit_status" >> "$diagnostic_dir/process-status.txt"
              else
                printf '%s=alive pid=%s state=%s\n' "$label" "$pid" "${process_state:-unavailable}" >> "$diagnostic_dir/process-status.txt"
              fi
            elif wait "$pid"; then
              printf '%s=exited pid=%s status=0\n' "$label" "$pid" >> "$diagnostic_dir/process-status.txt"
            else
              exit_status=$?
              printf '%s=exited pid=%s status=%s\n' "$label" "$pid" "$exit_status" >> "$diagnostic_dir/process-status.txt"
            fi
          }
          probe() {
            local label="$1" url="$2" result exit_status
            if result="$(curl --silent --show-error --output /dev/null --write-out 'HTTP %{http_code}' --connect-timeout 1 --max-time 2 "$url" 2>&1)"; then
              printf '%s=%s\n' "$label" "$result" >> "$diagnostic_dir/connectivity.txt"
            else
              exit_status=$?
              printf '%s=failed exit=%s detail=%s\n' "$label" "$exit_status" "$result" >> "$diagnostic_dir/connectivity.txt"
            fi
          }
          sanitize_startup_logs() {
            DIAGNOSTIC_DIR="$diagnostic_dir" OWNED_DIR="$owned_dir" python - <<'PY'
          import os
          import re
          from pathlib import Path

          diagnostic_dir = Path(os.environ["DIAGNOSTIC_DIR"])
          owned_dir = Path(os.environ["OWNED_DIR"])
          sensitive_value = re.compile(
              r'''(?i)(password|secret|token|authorization|cookie|credential|api[_-]?key)(["']?\s*[:=]\s*)("[^"]*"|'[^']*'|[^\s,;}]+)'''
          )
          url_credentials = re.compile(r"(://)[^/@\s]+:[^/@\s]+@")
          controls = re.compile(r"[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]")

          for source_name, target_name in (("api.log", "api.log"), ("ui.log", "ui.log")):
              source = owned_dir / source_name
              if not source.is_file():
                  (diagnostic_dir / target_name).write_text("Log file was not created.\n")
                  continue
              with source.open("rb") as stream:
                  raw = stream.read(49152).decode("utf-8", errors="replace")
              lines = raw.splitlines()[:160]
              safe_lines = []
              for line in lines:
                  line = controls.sub("", line)[:1000]
                  line = sensitive_value.sub(r"\1\2<redacted>", line)
                  line = url_credentials.sub(r"\1<redacted>@", line)
                  safe_lines.append(line)
              sanitized = ("\n".join(safe_lines) + "\n").encode("utf-8")[-49152:]
              (diagnostic_dir / target_name).write_bytes(sanitized)
          PY
          }
          collect_diagnostics() {
            : > "$diagnostic_dir/process-status.txt"
            : > "$diagnostic_dir/connectivity.txt"
            record_process api "$api_pid"
            record_process frontend "$ui_pid"
            probe api_ready http://127.0.0.1:8000/api/ready
            probe frontend http://127.0.0.1:5173/
            if [[ ! -f "$diagnostic_dir/api.log" || ! -f "$diagnostic_dir/ui.log" ]]; then
              sanitize_startup_logs
            fi
          }
          cleanup() {
            local status=$?
            trap - EXIT
            set +e
            if (( status != 0 )); then
              printf 'browser workflow failed with exit status %s\n' "$status" > "$diagnostic_dir/step-status.txt"
              collect_diagnostics
              printf 'Sanitized browser diagnostics retained at %s\n' "$diagnostic_dir"
              printf 'Browser process status:\n'
              cat "$diagnostic_dir/process-status.txt"
              printf 'Browser connectivity:\n'
              cat "$diagnostic_dir/connectivity.txt"
              printf 'Sanitized API startup log:\n'
              cat "$diagnostic_dir/api.log"
              printf 'Sanitized frontend startup log:\n'
              cat "$diagnostic_dir/ui.log"
            else
              rm -rf -- "$diagnostic_dir"
            fi
            kill "${ui_pid:-}" "${api_pid:-}" 2>/dev/null || true
            [[ -z "${ui_pid:-}" ]] || wait "$ui_pid" 2>/dev/null || true
            [[ -z "${api_pid:-}" ]] || wait "$api_pid" 2>/dev/null || true
            if [[ -f "$owned_dir/.drillloop-test-owner" ]] && [[ "$(cat "$owned_dir/.drillloop-test-owner")" == "$token" ]]; then
              rm -rf -- "$owned_dir"
            fi
            return "$status"
          }
          trap cleanup EXIT
          export DRILLLOOP_TEST_MODE=1
          export DRILLLOOP_TEST_DB_ROOT="$owned_dir"
          export DRILLLOOP_TEST_DB_TOKEN="$token"
          export DATABASE_URL="sqlite:///$owned_dir/test-browser.sqlite3"
          export DRILLLOOP_ENVIRONMENT=test
          export DRILLLOOP_COOKIE_SECURE=0
          DRILLLOOP_SESSION_SECRET="$(python -c 'import secrets; print(secrets.token_hex(48))')"
          export DRILLLOOP_SESSION_SECRET
          export DRILLLOOP_ENABLE_DEMO_SEED=1
          export DEMO_SEED=0
          export DRILLLOOP_UPLOAD_SCAN_MODE=disabled
          DRILLLOOP_USERS_JSON="$(PYTHONPATH=backend python -c 'import json; from app.auth import hash_password; print(json.dumps([{"id":"ci-admin","username":"ci-admin","name":"Demo Administrator","role":"admin","organization_id":"ci","password_hash":hash_password("ci-only-browser-password")},{"id":"ci-outsider","username":"ci-outsider","name":"CI Viewer","role":"viewer","organization_id":"ci","password_hash":hash_password("ci-only-outsider-password")}]))')"
          export DRILLLOOP_USERS_JSON
          alembic upgrade head
          DRILLLOOP_TEST_DB_ALLOW_EXISTING=1 PYTHONPATH=backend uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$owned_dir/api.log" 2>&1 &
          api_pid=$!
          npm --prefix frontend run dev -- --host 127.0.0.1 > "$owned_dir/ui.log" 2>&1 &
          ui_pid=$!
          ready=0
          attempt=0
          readiness_deadline=$((SECONDS + 60))
          while (( attempt < 60 && SECONDS < readiness_deadline )); do
            attempt=$((attempt + 1))
            api_state="$(ps -p "$api_pid" -o stat= 2>/dev/null | tr -d '[:space:]' || true)"
            if ! kill -0 "$api_pid" 2>/dev/null || [[ "$api_state" == Z* ]]; then
              if wait "$api_pid"; then api_status=0; else api_status=$?; fi
              printf 'Uvicorn exited before readiness (status %s).\n' "$api_status" >&2
              exit 1
            fi
            ui_state="$(ps -p "$ui_pid" -o stat= 2>/dev/null | tr -d '[:space:]' || true)"
            if ! kill -0 "$ui_pid" 2>/dev/null || [[ "$ui_state" == Z* ]]; then
              if wait "$ui_pid"; then ui_status=0; else ui_status=$?; fi
              printf 'Vite exited before readiness (status %s).\n' "$ui_status" >&2
              exit 1
            fi
            api_code="$(curl --silent --output "$owned_dir/.api-ready-body" --write-out '%{http_code}' --connect-timeout 1 --max-time 1 http://127.0.0.1:8000/api/ready || true)"
            if (( SECONDS >= readiness_deadline )); then break; fi
            ui_code="$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 1 --max-time 1 http://127.0.0.1:5173/ || true)"
            if [[ "$api_code" == 200 ]] && python -c 'import json,sys; assert json.load(open(sys.argv[1], encoding="utf-8")).get("status") == "ready"' "$owned_dir/.api-ready-body" 2>/dev/null && [[ "$ui_code" == 200 ]]; then
              ready=1
              break
            fi
            if (( SECONDS < readiness_deadline )); then sleep 1; fi
          done
          if (( ready == 0 )); then
            printf 'API/frontend readiness timed out after 60 seconds (%s attempts).\n' "$attempt" >&2
            exit 1
          fi
          printf 'API and frontend ready after %s readiness attempts.\n' "$attempt"
          curl --fail --silent --show-error --connect-timeout 1 --max-time 2 http://127.0.0.1:8000/api/ready
          sanitize_startup_logs
          DRILLLOOP_E2E_USERNAME=ci-admin DRILLLOOP_E2E_PASSWORD=ci-only-browser-password DRILLLOOP_E2E_OUTSIDER_USERNAME=ci-outsider DRILLLOOP_E2E_OUTSIDER_PASSWORD=ci-only-outsider-password node frontend/e2e/live-workflow.mjs

      - name: Upload sanitized browser startup diagnostics
        if: ${{ failure() && steps.browser_workflow.outcome == 'failure' && steps.browser_workflow.outputs.diagnostics_dir != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-startup-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.browser_workflow.outputs.diagnostics_dir }}/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Build production container
        run: docker build --build-arg BUILD_VERSION=ci --build-arg "BUILD_REVISION=${GITHUB_SHA}" --tag drillloop:ci .

      - name: Verify hardened container against disposable PostgreSQL
        id: container_verification
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_dir="$(mktemp -d "${RUNNER_TEMP}/drillloop-container-diagnostics.XXXXXX")"
          chmod 700 "$diagnostic_dir"
          printf 'diagnostics_dir=%s\n' "$diagnostic_dir" >> "$GITHUB_OUTPUT"
          secret_dir=""
          token=""
          db_password_value=""
          session_secret_value=""
          users_json_value=""
          container_name="drillloop-ci-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-$(python -c 'import secrets; print(secrets.token_hex(4))')"
          ready_http_status=not-probed
          port_listeners_before=not-recorded
          capture_listeners() {
            if command -v ss >/dev/null 2>&1; then
              sudo ss -H -ltnp '( sport = :8000 )' 2>&1 | head -n 40 | cut -c1-1000 || true
            else
              printf 'ss is unavailable on the runner.\n'
            fi
          }
          sanitize_file() {
            local source="$1" target="$2" limit="${3:-49152}"
            SOURCE_FILE="$source" TARGET_FILE="$target" BYTE_LIMIT="$limit" \
              REDACT_DB_PASSWORD="${db_password_value:-}" REDACT_SESSION_SECRET="${session_secret_value:-}" \
              REDACT_USERS_JSON="${users_json_value:-}" REDACT_OWNER_TOKEN="${token:-}" python - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path(os.environ["SOURCE_FILE"])
          target = Path(os.environ["TARGET_FILE"])
          byte_limit = int(os.environ["BYTE_LIMIT"])
          try:
              raw = source.read_bytes()[:byte_limit].decode("utf-8", errors="replace")
          except OSError:
              raw = "Diagnostic source was unavailable.\n"
          for secret in (
              os.environ["REDACT_DB_PASSWORD"],
              os.environ["REDACT_SESSION_SECRET"],
              os.environ["REDACT_USERS_JSON"],
              os.environ["REDACT_OWNER_TOKEN"],
          ):
              if secret:
                  raw = raw.replace(secret, "<redacted>")
          for value in re.findall(
              r'"password_hash"\s*:\s*"([^"]+)"', os.environ["REDACT_USERS_JSON"]
          ):
              raw = raw.replace(value, "<redacted>")
          raw = re.sub(
              r'''(?i)(password|secret|token|authorization|cookie|credential|api[_-]?key)(["']?\s*[:=]\s*)("[^"]*"|'[^']*'|[^\s,;}]+)''',
              r"\1\2<redacted>",
              raw,
          )
          raw = re.sub(r"(?i)bearer\s+[^\s,;]+", "Bearer <redacted>", raw)
          raw = re.sub(r"(://)[^/@\s]+:[^/@\s]+@", r"\1<redacted>@", raw)
          raw = re.sub(r"-----BEGIN [^-]+-----.*?-----END [^-]+-----", "<redacted-key>", raw, flags=re.S)
          raw = re.sub(r"[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]", "", raw)
          lines = raw.splitlines()[:200]
          target.write_text(("\n".join(line[:1200] for line in lines) + "\n")[-byte_limit:])
          PY
          }
          record_container_diagnostics() {
            : > "$diagnostic_dir/docker-ps.txt"
            docker ps -a --format '{{.ID}} {{.Names}} {{.Status}} {{.Ports}}' 2>&1 | head -n 100 | cut -c1-500 > "$diagnostic_dir/docker-ps.txt" || true
            if docker inspect "$container_name" >/dev/null 2>&1; then
              docker inspect --format 'name={{.Name}} state={{.State.Status}} exit_code={{.State.ExitCode}} error={{.State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} user={{.Config.User}} pid={{.State.Pid}}' "$container_name" > "$diagnostic_dir/container-state.txt" 2>&1 || true
              if [[ -n "$secret_dir" ]]; then
                docker logs --tail 200 --timestamps "$container_name" 2>&1 | head -c 49152 > "$secret_dir/container.log.raw" || true
                sanitize_file "$secret_dir/container.log.raw" "$diagnostic_dir/container.log.txt"
              fi
            else
              printf 'Container %s was not created or is no longer present.\n' "$container_name" > "$diagnostic_dir/container-state.txt"
              printf 'Container log was unavailable.\n' > "$diagnostic_dir/container.log.txt"
            fi
            printf 'Port 8000 listeners before launch:\n%s\n' "$port_listeners_before" > "$diagnostic_dir/port-listeners.txt"
            printf 'Port 8000 listeners at failure:\n' >> "$diagnostic_dir/port-listeners.txt"
            capture_listeners >> "$diagnostic_dir/port-listeners.txt"
            ready_status=000
            if [[ -n "$secret_dir" ]]; then
              if ready_status="$(curl --silent --show-error --connect-timeout 1 --max-time 3 --max-filesize 16384 --output "$secret_dir/readiness.raw" --write-out '%{http_code}' http://127.0.0.1:8000/api/ready 2>"$secret_dir/readiness-curl.raw")"; then
                :
              else
                ready_status=000
              fi
              printf 'HTTP status: %s\n' "$ready_status" > "$diagnostic_dir/readiness.txt"
              sanitize_file "$secret_dir/readiness.raw" "$diagnostic_dir/readiness-body.txt" 16384
              sanitize_file "$secret_dir/readiness-curl.raw" "$diagnostic_dir/readiness-curl.txt" 8192
            else
              printf 'HTTP status: not probed (secret directory was not created).\n' > "$diagnostic_dir/readiness.txt"
              printf 'Readiness body was unavailable.\n' > "$diagnostic_dir/readiness-body.txt"
              printf 'Readiness curl diagnostics were unavailable.\n' > "$diagnostic_dir/readiness-curl.txt"
            fi
            printf 'Last readiness-loop HTTP status: %s\n' "$ready_http_status" >> "$diagnostic_dir/readiness.txt"
          }
          cleanup() {
            local status=$?
            trap - EXIT
            set +e
            if (( status != 0 )); then
              printf 'Container verification failed with exit status %s.\n' "$status" > "$diagnostic_dir/step-status.txt"
              record_container_diagnostics
              printf 'Sanitized container diagnostics retained at %s\n' "$diagnostic_dir"
              cat "$diagnostic_dir/container-state.txt" "$diagnostic_dir/readiness.txt" "$diagnostic_dir/port-listeners.txt"
              cat "$diagnostic_dir/container.log.txt" "$diagnostic_dir/readiness-body.txt" "$diagnostic_dir/readiness-curl.txt"
            else
              rm -rf -- "$diagnostic_dir"
            fi
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            if [[ -n "$secret_dir" && -f "$secret_dir/.owner" ]] && [[ "$(cat "$secret_dir/.owner")" == "$token" ]]; then
              rm -rf -- "$secret_dir"
            fi
            return "$status"
          }
          trap cleanup EXIT
          secret_dir="$(mktemp -d "${RUNNER_TEMP}/drillloop-container.XXXXXX")"
          chmod 700 "$secret_dir"
          token="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          printf '%s' "$token" > "$secret_dir/.owner"
          db_password_value='ci-only-disposable-password'
          printf '%s' "$db_password_value" > "$secret_dir/db_password"
          users_json_value="$(PYTHONPATH=backend python -c 'import json; from app.auth import hash_password; print(json.dumps([{"id":"ci-admin","username":"ci-admin","name":"CI Admin","role":"admin","organization_id":"ci","password_hash":hash_password("ci-only-container-password")}]))')"
          printf '%s' "$users_json_value" > "$secret_dir/users.json"
          session_secret_value="$(python -c 'import secrets; print(secrets.token_hex(48))')"
          printf '%s' "$session_secret_value" > "$secret_dir/session_secret"
          chmod 600 "$secret_dir"/*
          sudo chown 10001:10001 "$secret_dir/db_password" "$secret_dir/users.json" "$secret_dir/session_secret"
          port_listeners_before="$(capture_listeners)"
          if [[ -n "$port_listeners_before" ]]; then
            printf 'Port 8000 is already occupied; refusing to probe an unrelated service.\n' >&2
            exit 1
          fi
          docker run --detach --name "$container_name" --network host --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 --cap-drop=ALL \
            --security-opt no-new-privileges:true --user 10001:10001 \
            --mount "type=bind,src=$secret_dir/db_password,dst=/run/secrets/database_password,readonly" \
            --mount "type=bind,src=$secret_dir/session_secret,dst=/run/secrets/session_secret,readonly" \
            --mount "type=bind,src=$secret_dir/users.json,dst=/run/secrets/users_json,readonly" \
            --env DRILLLOOP_ENVIRONMENT=production \
            --env DATABASE_URL=postgresql+psycopg://drillloop_ci@127.0.0.1:5432/drillloop_ci \
            --env DATABASE_PASSWORD_FILE=/run/secrets/database_password \
            --env DRILLLOOP_SESSION_SECRET_FILE=/run/secrets/session_secret \
            --env DRILLLOOP_USERS_FILE=/run/secrets/users_json \
            --env DRILLLOOP_COOKIE_SECURE=1 --env DRILLLOOP_UPLOAD_SCAN_MODE=required \
            --env DRILLLOOP_SCANNER_HOST=127.0.0.1 --env DRILLLOOP_SCANNER_PORT=3310 \
            --env DRILLLOOP_SCANNER_MAX_SIGNATURE_AGE_HOURS=72 \
            --env DRILLLOOP_TRUSTED_HOSTS=127.0.0.1,localhost --env DEMO_SEED=0 \
            drillloop:ci
          attempt=0
          readiness_deadline=$((SECONDS + 40))
          while (( attempt < 40 && SECONDS < readiness_deadline )); do
            ((attempt += 1))
            container_state="$(docker inspect --format '{{.State.Status}}' "$container_name" 2>/dev/null || printf 'missing')"
            if [[ "$container_state" != running ]]; then
              printf 'Hardened API container stopped before readiness (state=%s).\n' "$container_state" >&2
              exit 1
            fi
            if ready_http_status="$(curl --silent --show-error --connect-timeout 1 --max-time 2 --max-filesize 16384 --output "$secret_dir/readiness.json" --write-out '%{http_code}' http://127.0.0.1:8000/api/ready 2>"$secret_dir/readiness-curl.log")"; then
              if [[ "$ready_http_status" == 200 ]]; then
                if EXPECTED_REVISION="$GITHUB_SHA" python - "$secret_dir/readiness.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as response_file:
              response = json.load(response_file)
          scanner = response.get("scanner")
          if (
              response.get("status") != "ready"
              or response.get("app") != "DrillLoop"
              or response.get("revision") != os.environ["EXPECTED_REVISION"]
              or not isinstance(scanner, dict)
              or scanner.get("status") != "ready"
              or scanner.get("scan_capability") != "clean_and_eicar_verified"
              or float(scanner.get("signature_age_hours", 10**9)) > 72
          ):
              raise SystemExit("Readiness response did not match this ready DrillLoop build and scanner.")
          PY
                then
                  break
                else
                  printf 'Readiness returned HTTP 200 but the build revision or required scanner check did not match.\n' >&2
                  exit 1
                fi
              fi
            else
              ready_http_status=000
            fi
            if (( SECONDS < readiness_deadline )); then sleep 1; fi
          done
          if [[ "$ready_http_status" != 200 ]]; then
            printf 'Hardened API did not become ready within the existing 40-second readiness window (%s attempts, last HTTP status %s).\n' "$attempt" "$ready_http_status" >&2
            exit 1
          fi
          [[ "$(docker inspect --format '{{.State.Status}}' "$container_name")" == running ]]

      - name: Upload sanitized container diagnostics
        if: ${{ failure() && steps.container_verification.outcome == 'failure' && steps.container_verification.outputs.diagnostics_dir != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hardened-container-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.container_verification.outputs.diagnostics_dir }}/*
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6

services:
  db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_DB: drillloop
      POSTGRES_USER: drillloop
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - drillloop-postgres:/var/lib/postgresql
    networks:
      - drillloop-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drillloop -d drillloop"]
      interval: 5s
      timeout: 4s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G

  app:
    build:
      context: .
      args:
        BUILD_VERSION: ${DRILLLOOP_BUILD_VERSION:-dev}
        BUILD_REVISION: ${DRILLLOOP_BUILD_REVISION:-unknown}
    restart: unless-stopped
    environment: &app-environment
      DRILLLOOP_ENVIRONMENT: ${DRILLLOOP_ENVIRONMENT:?Set DRILLLOOP_ENVIRONMENT explicitly}
      DATABASE_URL: postgresql+psycopg://drillloop@db:5432/drillloop
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DRILLLOOP_SESSION_SECRET_FILE: /run/secrets/session_secret
      DRILLLOOP_USERS_FILE: /run/secrets/users_json
      DRILLLOOP_COOKIE_SECURE: ${DRILLLOOP_COOKIE_SECURE:?Set DRILLLOOP_COOKIE_SECURE explicitly}
      DRILLLOOP_TRUSTED_HOSTS: ${DRILLLOOP_TRUSTED_HOSTS:?Set DRILLLOOP_TRUSTED_HOSTS explicitly}
      DRILLLOOP_CORS_ORIGINS: ${DRILLLOOP_CORS_ORIGINS:-}
      DRILLLOOP_UPLOAD_SCAN_MODE: ${DRILLLOOP_UPLOAD_SCAN_MODE:?Set DRILLLOOP_UPLOAD_SCAN_MODE explicitly}
      DRILLLOOP_PARSER_TIMEOUT_SECONDS: ${DRILLLOOP_PARSER_TIMEOUT_SECONDS:-15}
      DRILLLOOP_PARSER_QUEUE_TIMEOUT_SECONDS: ${DRILLLOOP_PARSER_QUEUE_TIMEOUT_SECONDS:-30}
      DRILLLOOP_PARSER_MEMORY_MB: ${DRILLLOOP_PARSER_MEMORY_MB:-768}
      DRILLLOOP_SCANNER_TIMEOUT_SECONDS: ${DRILLLOOP_SCANNER_TIMEOUT_SECONDS:-5}
      DRILLLOOP_SCANNER_HOST: ${DRILLLOOP_SCANNER_HOST:-clamav}
      DRILLLOOP_SCANNER_PORT: ${DRILLLOOP_SCANNER_PORT:-3310}
      DRILLLOOP_SCANNER_MAX_SIGNATURE_AGE_HOURS: ${DRILLLOOP_SCANNER_MAX_SIGNATURE_AGE_HOURS:-72}
      DRILLLOOP_QUARANTINE_DIR: /run/drillloop-quarantine
      DRILLLOOP_ENABLE_DEMO_SEED: ${DRILLLOOP_ENABLE_DEMO_SEED:-0}
      DRILLLOOP_DEMO_OWNER_ID: ${DRILLLOOP_DEMO_OWNER_ID:-}
      DEMO_SEED: ${DEMO_SEED:-0}
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-}
    secrets:
      - database_password
      - session_secret
      - users_json
    networks:
      - drillloop-internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /run/drillloop-quarantine:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  clamav:
    image: clamav/clamav-debian:1.5.4@sha256:c21aa18cc0a358678255a3dfb343a4555b58f71b97d7b869df8fdf7ea0a5b4b1
    profiles: ["scanner"]
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
      FRESHCLAM_CHECKS: ${DRILLLOOP_FRESHCLAM_CHECKS:-4}
    volumes:
      - clamav-signatures:/var/lib/clamav
    networks:
      - drillloop-internal
      - scanner-egress
    expose:
      - "3310"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 6m
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 5G

  ingress:
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    restart: unless-stopped
    ports:
      - "${DRILLLOOP_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    networks:
      - drillloop-internal
      - drillloop-edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./deploy/nginx/drillloop.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  migrate:
    profiles: ["maintenance"]
    build:
      context: .
      args:
        BUILD_VERSION: ${DRILLLOOP_BUILD_VERSION:-dev}
        BUILD_REVISION: ${DRILLLOOP_BUILD_REVISION:-unknown}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: *app-environment
    secrets:
      - database_password
      - session_secret
      - users_json
    networks:
      - drillloop-internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

networks:
  drillloop-internal:
    internal: true
  drillloop-edge:
  scanner-egress:
    driver: bridge

volumes:
  drillloop-postgres:
  clamav-signatures:

secrets:
  database_password:
    file: ${DRILLLOOP_DB_PASSWORD_FILE:?Set DRILLLOOP_DB_PASSWORD_FILE to a private file}
  session_secret:
    file: ${DRILLLOOP_SESSION_SECRET_FILE:?Set DRILLLOOP_SESSION_SECRET_FILE to a private file}
  users_json:
    file: ${DRILLLOOP_USERS_FILE:?Set DRILLLOOP_USERS_FILE to a private account configuration file}

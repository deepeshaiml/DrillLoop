# Reference ingress only. Supply organization-approved certificates, hostnames,
# cipher policy, logging, and network controls before using it in a deployment.
limit_req_zone $binary_remote_addr zone=drillloop_api:10m rate=10r/s;

server {
    listen 8080;
    server_name drillloop.example.invalid;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl http2;
    server_name drillloop.example.invalid;
    access_log off;

    # Replace with certificate paths provisioned by the selected TLS operator.
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 31m;
    client_body_timeout 20s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        limit_req zone=drillloop_api burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @drillloop_rate_limited;
        proxy_request_buffering on;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location @drillloop_rate_limited {
        internal;
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Retry-After "2" always;
        return 429 '{"detail":{"code":"EDGE_RATE_LIMITED","message":"Too many API requests. Wait 2 seconds and retry."}}';
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }
}
